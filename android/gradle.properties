# Heap sized to fit alongside the Kotlin daemon, the Dart frontend and the OS.
# This was -Xmx8G with a 4G metaspace: a ceiling of ~12G for a single JVM on a
# 16G machine, which the OS killed mid-build (exit 137 / exit 4 with no Gradle
# error, because the process died rather than failing). 3G is comfortably above
# what this module actually needs.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Only one JVM's worth of memory at a time.
org.gradle.parallel=false

# Off, not on: the project lives on D: while the Kotlin Gradle plugin's
# incremental cache tries to relativize plugin sources against it, and those
# plugins are checked out under the pub cache on C:. Windows has no relative
# path across drive letters, so every plugin module (flutter_timezone,
# pedometer, image_picker_android, ...) throws "this and base files have
# different roots" and the build never gets past compileDebugKotlin. Trades
# back the shorter incremental rebuilds for a build that actually completes.
kotlin.incremental=false
kotlin.incremental.multiplatform=false
